    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.buildcraftcore]]
    modId="buildcraftlib"
    type="required"
    versionRange="[8.0.0.0,)"
    ordering="AFTER"
    side="BOTH"

