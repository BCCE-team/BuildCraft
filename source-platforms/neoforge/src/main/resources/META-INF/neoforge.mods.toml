modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
showAsResourcePack=false

[[mods]]
    modId="buildcraftlib"
    version="${mod_version}"
    displayName="BuildCraft Community Edition - Library"
    credits="Special thanks to the original BuildCraft team and all contributors."
    authors="CurativeTree, ShipovskijKorp"
    description='''
Shared library code and runtime helpers used by the BuildCraft Community Edition modules.
    '''

[[dependencies.buildcraftlib]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.buildcraftlib]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.buildcraftlib]]
    modId="jei"
    type="optional"
    versionRange="${jei_version_range}"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.buildcraftlib]]
    modId="jade"
    type="optional"
    versionRange="${jade_version_range}"
    ordering="AFTER"
    side="BOTH"

[[mods]]
    modId="buildcraftcore"
