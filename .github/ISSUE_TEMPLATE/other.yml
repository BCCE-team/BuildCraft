name: Other
description: Open an issue that does not fit the bug, crash, or suggestion forms.
body:
  - type: dropdown
    id: selected-label
    attributes:
      label: Label
      description: Choose the label that best describes this issue.
      options:
        - bug
        - crash
        - documentation
        - duplicate
        - enhancement
        - good first issue
        - help
        - invalid
        - other
        - question
        - suggestion
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue, question, request, or topic.
      placeholder: Add all relevant details here.
    validations:
      required: true
