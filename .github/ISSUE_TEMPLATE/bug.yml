name: Bug report
description: Report incorrect or broken BuildCraft Community Edition behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough information to reproduce the problem.

  - type: dropdown
    id: minecraft-version
    attributes:
      label: Minecraft version
      description: Which Minecraft version are you using?
      options:
        - 1.19.2
        - 1.20.1
        - 1.21.1
        - 1.21.11
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Mod loader
      description: Which loader are you using?
      options:
        - Forge
        - NeoForge
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: BuildCraft Community Edition version
      description: Enter the exact BCCE version, or leave latest if you are using the newest release.
      value: "latest"
      placeholder: "latest"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What is broken, and what did you expect to happen instead?
      placeholder: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the shortest reliable way to reproduce the bug.
      placeholder: |
        1. Place ...
        2. Connect ...
        3. Do ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, videos, modpack details, logs, or anything else that may help.
    validations:
      required: false
