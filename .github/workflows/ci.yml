name: BuildCraft CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buildcraft-multibuild-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source architecture and parity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java for offline compatibility probes
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate independent Stonecutter builds
        run: python scripts/validate-stonecutter.py

      - name: Validate hybrid source layout
        run: python scripts/validate-source-families.py

      - name: Enforce architecture budgets and trend
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          args=(
            --json build/reports/source-architecture/architecture-hardening.json
            --markdown build/reports/source-architecture/architecture-hardening.md
          )
          if [[ -n "${BASE_SHA:-}" ]]; then
            args+=(--budget-ref "$BASE_SHA")
          fi
          python scripts/validate-architecture-hardening.py "${args[@]}"
          cat build/reports/source-architecture/architecture-hardening.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate API v2 boundary
        run: python scripts/validate-api-v2.py

      - name: Validate API v2-only public surface
        run: python scripts/validate-api-v2-only.py

      - name: Validate API2 runtime completeness
        run: python scripts/validate-api2-runtime-completeness.py

      - name: Validate API2 module contracts
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate-core-misc-api2.py
          python scripts/validate-energy-api2.py
          python scripts/validate-facades-lists-map-api2.py
          python scripts/validate-robots-api2.py
          python scripts/validate-schematics-api2.py
          python scripts/validate-signals-automation-api2.py
          python scripts/validate-statements-api2.py
          python scripts/validate-transport-api2.py

      - name: Validate repository cleanliness
        run: python scripts/validate-repository-cleanliness.py

      - name: Validate Forge 1.20.1 port invariants
        run: python scripts/validate-1.20.1-target.py --source-root version-src/1.20.1-forge

      - name: Validate cross-version gameplay parity
        run: python scripts/validate-behavior-parity.py

      - name: Validate 1.21.11 parity
        run: python scripts/validate-12111-parity.py

      - name: Validate Zone Planner block preview parity
        run: python scripts/validate-zone-planner-preview.py

      - name: Validate FE compatibility
        run: python scripts/validate-fe-compat.py

      - name: Validate FE Engine and MJ Dynamo parity
        run: python scripts/validate-fe-mj-engine-parity.py

      - name: Validate JEI crafting layout parity
        run: python scripts/validate-jei-crafting-layouts.py

      - name: Validate gameplay, render and performance regressions
        run: python scripts/validate-regressions.py

      - name: Validate guidebook runtime claims
        run: python scripts/validate-guide-runtime-claims.py

      - name: Test internal Minecraft compatibility boundaries
        run: python -m unittest discover -s scripts/tests -p test_minecraft_compat.py -v

      - name: Test actor tickets and client registration boundaries
        run: python -m unittest discover -s scripts/tests -p test_actor_client_boundaries.py -v

      - name: Test loader-neutral packet boundaries
        run: python -m unittest discover -s scripts/tests -p test_loader_boundaries.py -v

      - name: Test storage, event, registry and config boundaries
        run: python -m unittest discover -s scripts/tests -p test_platform_boundaries.py -v

      - name: Test capability lifecycle invalidation and revival
        run: python -m unittest discover -s scripts/tests -p test_capability_lifecycle.py -v

      - name: Test platform contracts
        run: python -m unittest discover -s scripts/tests -p test_platform_contracts.py -v

      - name: Test pure Java gameplay algorithms
        run: python -m unittest discover -s scripts/tests -p test_pure_logic.py -v

      - name: Test pipe items, recipe book and optional client integrations
        run: python -m unittest discover -s scripts/tests -p test_client_integrations.py -v

      - name: Test GUI regressions
        run: python -m unittest discover -s scripts/tests -p test_gui_regressions.py -v

      - name: Test blueprint inventory-copy edge cases
        run: python -m unittest discover -s scripts/tests -p test_inventory_copy_edge_cases.py -v

      - name: Test Silicon recipe discovery and selection
        run: python -m unittest discover -s scripts/tests -p test_silicon_recipe_book.py -v

      - name: Test Guide Book filtering pagination and live previews
        run: python -m unittest discover -s scripts/tests -p test_guide_book_features.py -v

      - name: Test ownership persistence and ledgers
        run: python -m unittest discover -s scripts/tests -p test_ownership_ledgers.py -v

      - name: Test canonical resource pipeline
        run: python -m unittest discover -s scripts/tests -p test_resource_pipeline.py -v

      - name: Validate resources, metadata and build hygiene
        run: python scripts/validate-cross-target-integrity.py

  build-test-server:
    name: Build, test and smoke ${{ matrix.generation }} targets
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        generation:
          - legacy
          - modern
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
      BUILD_GENERATION: ${{ matrix.generation }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java toolchains
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install headless client runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      - name: Make build scripts executable
        run: chmod +x builds/legacy/gradlew builds/modern/gradlew build-all.sh scripts/ci-server-smoke.sh scripts/ci-client-smoke.sh scripts/source_layout.py scripts/validate-stonecutter.py scripts/validate-api-v2.py scripts/validate-api-v2-only.py

      - name: Build and test generation
        shell: bash
        run: |
          set -euo pipefail
          cd "builds/${BUILD_GENERATION}"

          build_log="$(mktemp)"
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace buildAndCollect 2>&1 | tee "$build_log"
          build_status=${PIPESTATUS[0]}
          set -e

          if [[ "$build_status" -eq 0 ]]; then
            exit 0
          fi

          # ForgeGradle occasionally leaves a truncated/corrupt transformed JAR in
          # Gradle User Home (or restores one from the Actions cache). Only retry
          # failures that are unmistakably ZIP/JAR corruption; real compile/test
          # failures still fail immediately with their original status.
          if [[ "$BUILD_GENERATION" != "legacy" ]] || ! grep -Eq \
            'ZipException|invalid LOC header|zip END header not found' "$build_log"; then
            exit "$build_status"
          fi

          echo "::warning title=ForgeGradle cache corruption::Corrupt JAR/ZIP detected while building legacy targets; clearing ForgeGradle dependency caches and retrying once."

          rm -rf \
            "$HOME/.gradle/caches/forge_gradle" \
            "$HOME/.gradle/caches/modules-2/files-2.1/maven.modrinth" \
            "$HOME/.gradle/caches/modules-2/files-2.1/net.minecraftforge"
          find versions -type d -name fg_cache -prune -exec rm -rf {} +

          # Retry sequentially so a cold ForgeGradle cache is rebuilt without
          # concurrent target transforms fighting over shared cache state.
          ./gradlew --no-daemon --no-parallel --console=plain --stacktrace --refresh-dependencies buildAndCollect

      - name: Run GameTests for every production target in generation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t targets < <(python scripts/validate-stonecutter.py --list-targets --generation "$BUILD_GENERATION")
          cd "builds/${BUILD_GENERATION}"
          gametest_status=0
          for target in "${targets[@]}"; do
            echo "Game-testing ${BUILD_GENERATION}/${target}"
            if ! ./gradlew --no-daemon --console=plain --stacktrace ":${target}:runGameTestServer"; then
              gametest_status=1
              echo "::error title=GameTests failed::${BUILD_GENERATION}/${target} GameTests failed"
            fi
          done
          exit "$gametest_status"

      - name: Smoke-test every production jar in generation
        shell: bash
        env:
          SERVER_STARTUP_TIMEOUT: '360'
          SERVER_RUNTIME_PROFILE: base
        run: |
          set -euo pipefail
          mapfile -t targets < <(python scripts/validate-stonecutter.py --list-targets --generation "$BUILD_GENERATION")
          for target in "${targets[@]}"; do
            echo "Smoke-testing ${BUILD_GENERATION}/${target}"
            STONECUTTER_TARGET="$target" bash scripts/ci-server-smoke.sh
          done

      - name: Client smoke-test every production target in generation
        shell: bash
        env:
          CLIENT_STARTUP_TIMEOUT: '480'
          CLIENT_STABILITY_SECONDS: '20'
          CLIENT_RUNTIME_PROFILE: jei
        run: |
          set -euo pipefail
          mapfile -t targets < <(python scripts/validate-stonecutter.py --list-targets --generation "$BUILD_GENERATION")
          client_status=0
          for target in "${targets[@]}"; do
            echo "Client smoke-testing ${BUILD_GENERATION}/${target}"
            if ! STONECUTTER_TARGET="$target" bash scripts/ci-client-smoke.sh; then
              client_status=1
              echo "::error title=Client smoke failed::${BUILD_GENERATION}/${target} client smoke failed"
            fi
          done
          exit "$client_status"

      - name: Upload build products and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildcraft-${{ matrix.generation }}-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/libs/${{ matrix.generation }}/**
            builds/${{ matrix.generation }}/versions/*/build/libs/**
            builds/${{ matrix.generation }}/versions/*/build/reports/tests/**
            builds/${{ matrix.generation }}/versions/*/build/test-results/**
            run/${{ matrix.generation }}/*/logs/**
            run/${{ matrix.generation }}/*/crash-reports/**
            run-server/${{ matrix.generation }}/*/logs/**
            run-server/${{ matrix.generation }}/*/crash-reports/**
            ci-server-${{ matrix.generation }}-*.log
            ci-server-install-${{ matrix.generation }}-*.log
            ci-client-${{ matrix.generation }}-*.log

  Compatibility:
    needs:
      - validate
      - build-test-server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 1.19.2-forge
            profile: forestry
          - target: 1.19.2-forge
            profile: ic2
          - target: 1.20.1-forge
            profile: forestry
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
      BUILD_GENERATION: legacy
      STONECUTTER_TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect profile support
        id: support
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          key="target.${STONECUTTER_TARGET}.deps.${PROFILE}"
          dependency="$(awk -F= -v key="$key" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' build-config/targets.properties)"
          if [[ -n "$dependency" ]]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "Compatibility profile '$PROFILE' is not configured for $STONECUTTER_TARGET; skipping."
          fi

      - name: Set up Java toolchains
        if: steps.support.outputs.supported == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Python
        if: steps.support.outputs.supported == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        if: steps.support.outputs.supported == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        if: steps.support.outputs.supported == 'true'
        run: chmod +x builds/legacy/gradlew scripts/ci-server-smoke.sh scripts/source_layout.py

      - name: Smoke-test compatibility server
        if: steps.support.outputs.supported == 'true'
        id: smoke
        env:
          SERVER_STARTUP_TIMEOUT: '360'
          SERVER_RUNTIME_PROFILE: ${{ matrix.profile }}
        run: bash scripts/ci-server-smoke.sh

      - name: Report compatibility result
        if: steps.support.outputs.supported == 'true' && always()
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          if [[ "$OUTCOME" == success ]]; then
            echo "### $PROFILE compatibility: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=$PROFILE compatibility failed::The $STONECUTTER_TARGET / $PROFILE server stack did not reach the ready state."
            echo "### $STONECUTTER_TARGET / $PROFILE compatibility: failed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compatibility diagnostics
        if: steps.support.outputs.supported == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: buildcraft-compat-${{ matrix.target }}-${{ matrix.profile }}-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            run/legacy/${{ matrix.target }}/logs/**
            run/legacy/${{ matrix.target }}/crash-reports/**
            ci-server-legacy-${{ matrix.target }}-${{ matrix.profile }}.log
