name: BuildCraft CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: buildcraft-multibuild-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source architecture and parity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java for offline compatibility probes
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate independent Stonecutter builds
        run: python scripts/validate-stonecutter.py

      - name: Validate hybrid source layout
        run: python scripts/validate-source-families.py

      - name: Enforce architecture budgets and trend
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          args=(
            --json build/reports/source-architecture/architecture-hardening.json
            --markdown build/reports/source-architecture/architecture-hardening.md
          )
          if [[ -n "${BASE_SHA:-}" ]]; then
            args+=(--budget-ref "$BASE_SHA")
          fi
          python scripts/validate-architecture-hardening.py "${args[@]}"
          cat build/reports/source-architecture/architecture-hardening.md >> "$GITHUB_STEP_SUMMARY"

      - name: Validate API v2 boundary
        run: python scripts/validate-api-v2.py

      - name: Validate API v2-only public surface
        run: python scripts/validate-api-v2-only.py

      - name: Validate API2 runtime completeness
        run: python scripts/validate-api2-runtime-completeness.py

      - name: Validate API2 module contracts
        run: python scripts/validate-api2-modules.py

      - name: Validate repository cleanliness
        run: python scripts/validate-repository-cleanliness.py

      - name: Validate cross-version gameplay parity
        run: python scripts/validate-behavior-parity.py

      - name: Validate 1.21.11 parity
        run: python scripts/validate-1.21.11-parity.py

      - name: Validate 26.1.2 target structure
        run: python scripts/validate-26.1.2-target.py

      - name: Test 26.X lib native boundaries
        run: python -m unittest discover -s scripts/tests -p test_lib_26.py -v

      - name: Test 26.X core native boundaries
        run: python -m unittest discover -s scripts/tests -p test_core_26.py -v

      - name: Test 26.X energy native boundaries
        run: python -m unittest discover -s scripts/tests -p test_energy_26.py -v

      - name: Test 26.X transport native boundaries
        run: python -m unittest discover -s scripts/tests -p test_transport_26.py -v

      - name: Test 26.X factory native boundaries
        run: python -m unittest discover -s scripts/tests -p test_factory_26.py -v

      - name: Test Volume Box and Filler Planner gameplay
        run: python -m unittest discover -s scripts/tests -p test_volume_filler_gameplay.py -v

      - name: Test 26.X builders native boundaries
        run: python -m unittest discover -s scripts/tests -p test_builders_26.py -v

      - name: Test 26.X silicon native boundaries
        run: python -m unittest discover -s scripts/tests -p test_silicon_26.py -v

      - name: Test 26.X compat and bucket presentation
        run: python -m unittest discover -s scripts/tests -p test_compat_buckets_26.py -v

      - name: Test 26.X robotics native boundaries
        run: python -m unittest discover -s scripts/tests -p test_robotics_26.py -v

      - name: Test MJ Dynamo wrench and Quarry lattice all targets
        run: python -m unittest discover -s scripts/tests -p test_cross_target_dynamo_quarry.py -v

      - name: Test uniform BC8 engine wrench rotation on all targets
        run: python -m unittest discover -s scripts/tests -p test_all_engine_wrench.py -v

      - name: Check Minecraft 26.2 compiler regressions
        run: python -m unittest discover -s scripts/tests -p test_262_compile_errors.py -v

      - name: Test 26.2 compiler compatibility
        run: python -m unittest discover -s scripts/tests -p test_262_compile_errors.py -v

      - name: Test 26.3 removed NeoForge APIs and worldgen migration
        run: python -m unittest discover -s scripts/tests -p test_263_transfer_compile.py -v

      - name: Test 26.3 inventory adapters in Java
        run: python -m unittest discover -s scripts/tests -p test_263_item_storage_java.py -v
      - name: Test 26.3 removed vanilla APIs and power bridge
        run: python -m unittest discover -s scripts/tests -p test_263_followup_api.py -v

      - name: Validate Zone Planner block preview parity
        run: python scripts/validate-zone-planner-preview.py

      - name: Validate FE compatibility
        run: python scripts/validate-fe-compat.py

      - name: Validate FE Engine and MJ Dynamo parity
        run: python scripts/validate-fe-mj-engine-parity.py

      - name: Validate JEI crafting layout parity
        run: python scripts/validate-jei-crafting-layouts.py

      - name: Validate gameplay, render and performance regressions
        run: python scripts/validate-regressions.py

      - name: Validate guidebook runtime claims
        run: python scripts/validate-guide-runtime-claims.py

      - name: Test internal Minecraft compatibility boundaries
        run: python -m unittest discover -s scripts/tests -p test_minecraft_compat.py -v

      - name: Test actor tickets and client registration boundaries
        run: python -m unittest discover -s scripts/tests -p test_actor_client_boundaries.py -v

      - name: Test loader-neutral packet boundaries
        run: python -m unittest discover -s scripts/tests -p test_loader_boundaries.py -v

      - name: Test storage, event, registry and config boundaries
        run: python -m unittest discover -s scripts/tests -p test_platform_boundaries.py -v

      - name: Test capability lifecycle invalidation and revival
        run: python -m unittest discover -s scripts/tests -p test_capability_lifecycle.py -v

      - name: Test platform contracts
        run: python -m unittest discover -s scripts/tests -p test_platform_contracts.py -v

      - name: Test pure Java gameplay algorithms
        run: python -m unittest discover -s scripts/tests -p test_pure_logic.py -v

      - name: Test pipe items, recipe book and optional client integrations
        run: python -m unittest discover -s scripts/tests -p test_client_integrations.py -v

      - name: Test GUI regressions
        run: python -m unittest discover -s scripts/tests -p test_gui_regressions.py -v

      - name: Test blueprint inventory-copy edge cases
        run: python -m unittest discover -s scripts/tests -p test_inventory_copy_edge_cases.py -v

      - name: Test Silicon recipe discovery and selection
        run: python -m unittest discover -s scripts/tests -p test_silicon_recipe_book.py -v

      - name: Test Guide Book filtering pagination and live previews
        run: python -m unittest discover -s scripts/tests -p test_guide_book_features.py -v

      - name: Test ownership persistence and ledgers
        run: python -m unittest discover -s scripts/tests -p test_ownership_ledgers.py -v

      - name: Test canonical resource pipeline
        run: python -m unittest discover -s scripts/tests -p test_resource_pipeline.py -v

      - name: Test fluid sprite reload and model atlas references
        run: python -m unittest discover -s scripts/tests -p test_fluid_resource_reload_262.py -v

      - name: Validate resources, metadata and build hygiene
        run: python scripts/validate-cross-target-integrity.py

  build-test-server:
    name: Build, test and smoke ${{ matrix.target }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - target: 1.19.2-forge
            generation: old
            java: '17'
          - target: 1.20.1-forge
            generation: old
            java: '17'
          - target: 1.21.1-neoforge
            generation: 1.21.X
            java: '21'
          - target: 1.21.11-neoforge
            generation: 1.21.X
            java: '21'
          - target: 26.1.2-neoforge
            generation: 26.X
            java: '25'
          - target: 26.2-neoforge
            generation: 26.X
            java: '25'
          - target: 26.3-neoforge
            generation: 26.X
            java: '25'
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
      BUILD_GENERATION: ${{ matrix.generation }}
      STONECUTTER_TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up target Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Forge 1.20.1 target invariants
        if: matrix.target == '1.20.1-forge'
        run: python scripts/validate-1.20.1-target.py --source-root version-src/1.20.1-forge

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install headless client runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      - name: Make build scripts executable
        run: chmod +x builds/old/gradlew builds/1.21.X/gradlew builds/26.X/gradlew build-all.sh scripts/ci-server-smoke.sh scripts/ci-client-smoke.sh scripts/source_layout.py scripts/validate-stonecutter.py scripts/validate-api-v2.py scripts/validate-api-v2-only.py

      - name: Build and test target
        shell: bash
        run: |
          set -euo pipefail
          cd "builds/${BUILD_GENERATION}"

          build_log="$(mktemp)"
          set +e
          ./gradlew --no-daemon --console=plain --stacktrace ":${STONECUTTER_TARGET}:buildAndCollect" 2>&1 | tee "$build_log"
          build_status=${PIPESTATUS[0]}
          set -e

          if [[ "$build_status" -eq 0 ]]; then
            exit 0
          fi

          # ForgeGradle occasionally leaves a truncated/corrupt transformed JAR in
          # Gradle User Home (or restores one from the Actions cache). Only retry
          # failures that are unmistakably ZIP/JAR corruption; real compile/test
          # failures still fail immediately with their original status.
          if [[ "$BUILD_GENERATION" != "old" ]] || ! grep -Eq \
            'ZipException|invalid LOC header|zip END header not found' "$build_log"; then
            exit "$build_status"
          fi

          echo "::warning title=ForgeGradle cache corruption::Corrupt JAR/ZIP detected while building ${STONECUTTER_TARGET}; clearing ForgeGradle dependency caches and retrying once."

          rm -rf \
            "$HOME/.gradle/caches/forge_gradle" \
            "$HOME/.gradle/caches/modules-2/files-2.1/maven.modrinth" \
            "$HOME/.gradle/caches/modules-2/files-2.1/net.minecraftforge"
          find versions -type d -name fg_cache -prune -exec rm -rf {} +

          ./gradlew --no-daemon --no-parallel --console=plain --stacktrace --refresh-dependencies \
            ":${STONECUTTER_TARGET}:buildAndCollect"

      - name: Run GameTests
        shell: bash
        run: |
          set -euo pipefail
          cd "builds/${BUILD_GENERATION}"
          echo "Game-testing ${BUILD_GENERATION}/${STONECUTTER_TARGET}"
          if ! ./gradlew --no-daemon --console=plain --stacktrace ":${STONECUTTER_TARGET}:runGameTestServer"; then
            echo "::error title=GameTests failed::${BUILD_GENERATION}/${STONECUTTER_TARGET} GameTests failed"
            exit 1
          fi

      - name: Run Create compatibility GameTests
        shell: bash
        run: |
          set -euo pipefail
          key="target.${STONECUTTER_TARGET}.deps.create"
          dependency="$(awk -F= -v key="$key" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' build-config/targets.properties)"
          if [[ -z "$dependency" ]]; then
            echo "Create is not configured for ${STONECUTTER_TARGET}; skipping Create GameTests."
            exit 0
          fi
          cd "builds/${BUILD_GENERATION}"
          echo "Game-testing ${BUILD_GENERATION}/${STONECUTTER_TARGET} with Create"
          ./gradlew --no-daemon --console=plain --stacktrace -Pci_runtime_profile=create ":${STONECUTTER_TARGET}:runGameTestServer"

      - name: Smoke-test production jar
        shell: bash
        env:
          SERVER_STARTUP_TIMEOUT: '360'
          SERVER_RUNTIME_PROFILE: base
        run: |
          set -euo pipefail
          echo "Smoke-testing ${BUILD_GENERATION}/${STONECUTTER_TARGET}"
          bash scripts/ci-server-smoke.sh

      - name: Client smoke-test production target
        shell: bash
        env:
          CLIENT_STARTUP_TIMEOUT: '480'
          CLIENT_STABILITY_SECONDS: '20'
          CLIENT_RUNTIME_PROFILE: jei
        run: |
          set -euo pipefail
          echo "Client smoke-testing ${BUILD_GENERATION}/${STONECUTTER_TARGET}"
          if ! bash scripts/ci-client-smoke.sh; then
            echo "::error title=Client smoke failed::${BUILD_GENERATION}/${STONECUTTER_TARGET} client smoke failed"
            exit 1
          fi

      - name: Upload build products and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildcraft-${{ matrix.target }}-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/*/*.jar
            builds/${{ matrix.generation }}/versions/${{ matrix.target }}/build/reports/tests/**
            builds/${{ matrix.generation }}/versions/${{ matrix.target }}/build/test-results/**
            run/${{ matrix.generation }}/${{ matrix.target }}/logs/**
            run/${{ matrix.generation }}/${{ matrix.target }}/crash-reports/**
            run-server/${{ matrix.generation }}/${{ matrix.target }}/logs/**
            run-server/${{ matrix.generation }}/${{ matrix.target }}/crash-reports/**
            ci-server-${{ matrix.generation }}-${{ matrix.target }}-*.log
            ci-server-install-${{ matrix.generation }}-${{ matrix.target }}.log
            ci-client-${{ matrix.generation }}-${{ matrix.target }}-*.log

  Compatibility:
    needs:
      - validate
      - build-test-server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 1.19.2-forge
            profile: forestry
          - target: 1.19.2-forge
            profile: ic2
          - target: 1.20.1-forge
            profile: forestry
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dfile.encoding=UTF-8
      BUILD_GENERATION: old
      STONECUTTER_TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect profile support
        id: support
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          key="target.${STONECUTTER_TARGET}.deps.${PROFILE}"
          dependency="$(awk -F= -v key="$key" '$1 == key { sub(/^[^=]*=/, ""); print; exit }' build-config/targets.properties)"
          if [[ -n "$dependency" ]]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "Compatibility profile '$PROFILE' is not configured for $STONECUTTER_TARGET; skipping."
          fi

      - name: Set up Java toolchains
        if: steps.support.outputs.supported == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Python
        if: steps.support.outputs.supported == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Gradle
        if: steps.support.outputs.supported == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        if: steps.support.outputs.supported == 'true'
        run: chmod +x builds/old/gradlew scripts/ci-server-smoke.sh scripts/source_layout.py

      - name: Smoke-test compatibility server
        if: steps.support.outputs.supported == 'true'
        id: smoke
        env:
          SERVER_STARTUP_TIMEOUT: '360'
          SERVER_RUNTIME_PROFILE: ${{ matrix.profile }}
        run: bash scripts/ci-server-smoke.sh

      - name: Report compatibility result
        if: steps.support.outputs.supported == 'true' && always()
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
          OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          if [[ "$OUTCOME" == success ]]; then
            echo "### $PROFILE compatibility: passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=$PROFILE compatibility failed::The $STONECUTTER_TARGET / $PROFILE server stack did not reach the ready state."
            echo "### $STONECUTTER_TARGET / $PROFILE compatibility: failed" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compatibility diagnostics
        if: steps.support.outputs.supported == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: buildcraft-compat-${{ matrix.target }}-${{ matrix.profile }}-${{ github.run_number }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            run/old/${{ matrix.target }}/logs/**
            run/old/${{ matrix.target }}/crash-reports/**
            ci-server-old-${{ matrix.target }}-${{ matrix.profile }}.log
