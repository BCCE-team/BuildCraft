/* Forge-specific target adapter. Plugin resolution remains in the build-root shim. */
apply from: new File(rootProject.file('../..').canonicalFile, 'build-logic/common-target.gradle')

def bc = project.ext.bcTarget
def targetName = bc.targetName
def buildGeneration = bc.buildGeneration
def repositoryRoot = bc.repositoryRoot
def configuredProperty = bc.configuredProperty
def requiredProperty = bc.requiredProperty
def optionalProperty = bc.optionalProperty
def booleanProperty = bc.booleanProperty
def minecraftVersion = bc.minecraftVersion
def forgeVersion = requiredProperty('deps.forge')
def loaderName = bc.loaderName
def modVersion = bc.modVersion
def archiveName = bc.archiveName
def javaVersion = bc.javaVersion
def sourceFamily = bc.sourceFamily
def sourcePlatform = bc.sourcePlatform
def sharedSourceRoot = bc.sharedSourceRoot
def familySourceRoot = bc.familySourceRoot
def platformSourceRoot = bc.platformSourceRoot
def familyPlatformSourceRoot = bc.familyPlatformSourceRoot
def targetOverlayRoot = bc.targetOverlayRoot
def sourceLayers = bc.sourceLayers
def resolveSourceFile = bc.resolveSourceFile
def targetAccessTransformer = bc.targetAccessTransformer
def effectiveSourceRoot = bc.effectiveSourceRoot
def sourceLayoutScript = bc.sourceLayoutScript
def pythonExecutable = bc.pythonExecutable
def prepareEffectiveSource = bc.prepareEffectiveSource
def effectiveSourceDir = bc.effectiveSourceDir
def effectiveDirs = bc.effectiveDirs
def centralJarOutputDir = bc.centralJarOutputDir
def jeiCompatEnabled = booleanProperty('compat.jei.enabled', true)
def jadeCompatEnabled = booleanProperty('compat.jade.enabled', true)
def ic2CompatEnabled = booleanProperty('compat.ic2.enabled', true)
def forestryCompatEnabled = booleanProperty('compat.forestry.enabled', true)

def gameTestRunRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('rungametestserver')
}

// Each target is compiled from one generated effective tree assembled from
// shared + family + platform + target layers, then conditionally preprocessed.
sourceSets {
    main {
        java.setSrcDirs(effectiveDirs('src/main/java'))
        resources.setSrcDirs(effectiveDirs('src/main/resources'))
        if (gameTestRunRequested) {
            // Keep the single-module GameTest guard visible to the parity validator.
            resources.srcDir(new File(effectiveSourceDir, 'src/gametest/resources'))
            // Reorder the main resource roots so the GameTest tree is the overlay. processResources
            // uses EXCLUDE for GameTest runs, therefore the first copy of a duplicate path wins.
            resources.setSrcDirs([new File(effectiveSourceDir, 'src/gametest/resources')] + effectiveDirs('src/main/resources'))
        }
        if (gameTestRunRequested) {
            // GameTest sources are merged into main for dedicated GameTest runs.
            java.srcDir(new File(effectiveSourceDir, 'src/gametest/java'))
        }
    }
    test {
        java.setSrcDirs(effectiveDirs('src/test/java'))
        resources.setSrcDirs(effectiveDirs('src/test/resources'))
    }
    gameTest {
        java.setSrcDirs(effectiveDirs('src/gametest/java'))
        resources.setSrcDirs(effectiveDirs('src/gametest/resources'))
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.output
    }
    // API 2 is compiled a second time as an isolated surface. This proves that
    // the public API does not require BuildCraft implementation classes.
    apiV2 {
        java.setSrcDirs(effectiveDirs('src/main/java'))
        java.include 'buildcraft/api/v2/**'
        resources.setSrcDirs([])
        compileClasspath = sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
    // The consumer fixture intentionally excludes sourceSets.main.output. If it
    // imports implementation code, compilation must fail.
    addonFixture {
        java.setSrcDirs([new File(repositoryRoot, 'addon-fixture/src/main/java')])
        resources.setSrcDirs([])
        compileClasspath = sourceSets.apiV2.output + sourceSets.apiV2.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
}

if (!jeiCompatEnabled) {
    sourceSets.main.java.exclude 'buildcraft/compat/jei/**'
}
if (!jadeCompatEnabled) {
    sourceSets.main.java.exclude 'buildcraft/compat/jade/**'
}
// Keep Create out of compiled classes and distributed JARs.
sourceSets.main.java.exclude 'buildcraft/compat/create/**'
if (!ic2CompatEnabled) {
    sourceSets.main.java.exclude 'buildcraft/compat/ic2/**'
}
if (!forestryCompatEnabled) {
    sourceSets.main.java.exclude 'buildcraft/compat/forestry/**'
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

// A generated class keeps target-specific values out of shared Java sources.
def generatedTargetSources = layout.buildDirectory.dir('generated/sources/buildcraftTarget/java')


def gitMetadata = { List<String> args, String fallback ->
    try {
        def command = new ArrayList<String>()
        command.add('git')
        command.addAll(args)
        def process = new ProcessBuilder(command)
                .directory(repositoryRoot)
                .redirectErrorStream(true)
                .start()
        def text = process.inputStream.getText('UTF-8').trim()
        return process.waitFor() == 0 && !text.isBlank() ? text : fallback
    } catch (Exception ignored) {
        return fallback
    }
}

def gitBranch = providers.environmentVariable('GITHUB_REF_NAME')
        .getOrElse(gitMetadata(['rev-parse', '--abbrev-ref', 'HEAD'], 'unknown'))
def gitCommitHash = providers.environmentVariable('GITHUB_SHA')
        .getOrElse(gitMetadata(['rev-parse', 'HEAD'], 'unknown'))
def gitCommitMessage = gitMetadata(['log', '-1', '--pretty=%s'], 'unknown')
def gitCommitAuthor = gitMetadata(['log', '-1', '--pretty=%an <%ae>'], 'unknown')
def targetValues = [
        targetId: targetName,
        minecraft: minecraftVersion,
        loader: loaderName,
        protocol: requiredProperty('network.protocol'),
        modVersion: modVersion,
        gitBranch: gitBranch,
        gitCommitHash: gitCommitHash,
        gitCommitMessage: gitCommitMessage,
        gitCommitAuthor: gitCommitAuthor
]

def javaLiteral = { String value ->
    value.replace('\\', '\\\\')
            .replace('"', '\\"')
            .replace('\r', '\\r')
            .replace('\n', '\\n')
}

def generateBuildCraftTarget = tasks.register('generateBuildCraftTarget') {
    inputs.properties(targetValues)
    outputs.dir(generatedTargetSources)

    doLast {
        def outputFile = generatedTargetSources.get()
                .file('buildcraft/lib/net/BuildCraftTarget.java').asFile
        outputFile.parentFile.mkdirs()
        outputFile.setText("""package buildcraft.lib.net;

/** Generated by Gradle for the ${targetName} Stonecutter target. */
public final class BuildCraftTarget {
    public static final String MINECRAFT_VERSION = \"${javaLiteral(targetValues.minecraft)}\";
    public static final String LOADER = \"${javaLiteral(targetValues.loader)}\";
    public static final String NETWORK_PROTOCOL = \"${javaLiteral(targetValues.protocol)}\";
    public static final String MOD_VERSION = \"${javaLiteral(targetValues.modVersion)}\";
    public static final String TARGET_ID = \"${javaLiteral(targetValues.targetId)}\";
    public static final String GIT_BRANCH = \"${javaLiteral(targetValues.gitBranch)}\";
    public static final String GIT_COMMIT_HASH = \"${javaLiteral(targetValues.gitCommitHash)}\";
    public static final String GIT_COMMIT_MESSAGE = \"${javaLiteral(targetValues.gitCommitMessage)}\";
    public static final String GIT_COMMIT_AUTHOR = \"${javaLiteral(targetValues.gitCommitAuthor)}\";

    private BuildCraftTarget() {}
}
""", 'UTF-8')
    }
}

sourceSets.main.java.srcDir(generatedTargetSources)
tasks.named('compileJava') { dependsOn(generateBuildCraftTarget) }

// CI can launch a minimal server or one selected compatibility stack without
// changing the normal development runtime.
def enableIc2Runtime = ic2CompatEnabled && booleanProperty('enable_ic2_runtime', false)
// A diagnostic userdev run may opt out of local source injection and load an
// already-built production jar instead. Normal CI production smoke tests use a
// separately installed dedicated server and do not rely on this mode.
def useProductionJarRuntime = booleanProperty('use_production_jar_runtime', false)

// ForgeGradle's RunConfig.getAllSources() falls back to sourceSets.main when a
// run has neither explicit sources nor local mods. In production-jar smoke mode
// that fallback would put BuildCraft's exploded classes/resources on the module
// path next to the production jar, producing duplicate JPMS packages. Give the
// run an explicit empty source set so ForgeGradle has nothing local to inject.
def productionJarRuntimeSourceSet = null
if (useProductionJarRuntime) {
    productionJarRuntimeSourceSet = sourceSets.create('productionJarRuntime') {
        java.setSrcDirs([])
        resources.setSrcDirs([])
        compileClasspath = project.files()
        runtimeClasspath = project.files()
    }
}

// IT16: use distinct client/server game directories for a real two-process world join.
def ciWorldJoin = providers.gradleProperty('ci_world_join').map { it.toBoolean() }.getOrElse(false)
def ciWorldJoinAddress = providers.gradleProperty('ci_world_join_address').getOrElse('127.0.0.1:25588')
def ciWorldJoinClientSlot = providers.gradleProperty('ci_world_join_client_slot').getOrElse('1')
def ciWorldJoinExternalMods = providers.gradleProperty('ci_world_join_external_mods').getOrElse('')
def ciWorldJoinUsername = providers.gradleProperty('ci_world_join_username').getOrElse('')
if (ciWorldJoin && !(ciWorldJoinClientSlot in ['1', '2'])) {
    throw new GradleException('Unknown ci_world_join_client_slot: ' + ciWorldJoinClientSlot)
}
if (ciWorldJoin && ciWorldJoinUsername && !(ciWorldJoinUsername ==~ /[A-Za-z0-9_]{1,16}/)) {
    throw new GradleException('Invalid CI Minecraft username')
}
def ciWorldJoinRoot = new File(repositoryRoot, "run-modpack-join/${buildGeneration}/${targetName}")
def ciRuntimeProfile = providers.gradleProperty('ci_runtime_profile')
        .map { it.trim().toLowerCase() }
        .getOrElse('default')
def knownCiRuntimeProfiles = ['default', 'base', 'forestry', 'ic2', 'jei', 'jade', 'all', 'modpack']
if (!knownCiRuntimeProfiles.contains(ciRuntimeProfile)) {
    throw new GradleException("Unsupported ci_runtime_profile '${ciRuntimeProfile}'. Expected one of: ${knownCiRuntimeProfiles.sort().join(', ')}")
}

def gameTestRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('gametest')
}
def runtimeEnabled = { String profile, boolean defaultEnabled ->
    if (gameTestRequested && ciRuntimeProfile == 'default') return false
    if (ciRuntimeProfile == 'default') return defaultEnabled
    ciRuntimeProfile == 'all' || ciRuntimeProfile == profile ||
        (ciRuntimeProfile == 'modpack' && ['jei', 'jade', 'forestry', 'ic2'].contains(profile))
}

def runDirectory = new File(repositoryRoot, "run/${buildGeneration}/${targetName}")
def dataRunDirectory = new File(repositoryRoot, "run-data/${buildGeneration}/${targetName}")
def generatedResources = layout.buildDirectory.dir("generated-resources/datagen").get().asFile

minecraft {
    mappings channel: 'official', version: minecraftVersion
    accessTransformer = targetAccessTransformer

    runs {
        configureEach {
            workingDirectory runDirectory
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'forge.enabledGameTestNamespaces', 'forge,buildcraftlib'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath

            if (useProductionJarRuntime) {
                // Prevent RunConfig#getAllSources() from falling back to main.
                source productionJarRuntimeSourceSet
            } else {
                mods {
                    buildcraft {
                        source sourceSets.main
                    }
                }
            }
        }

        client {
            // Gradle's org.gradle.jvmargs does not limit the Minecraft client process.
            jvmArg '-Xmx4G'
            if (ciWorldJoin) {
                workingDirectory new File(ciWorldJoinRoot, ciWorldJoinClientSlot == '2' ? 'client-2' : 'client')
                // Minecraft 1.19.2 predates Quick Play; use the legacy direct-join CLI.
                if (minecraftVersion == '1.19.2') {
                    def separator = ciWorldJoinAddress.lastIndexOf(':')
                    if (separator <= 0 || separator == ciWorldJoinAddress.length() - 1) {
                        throw new GradleException("Invalid IT16 server address: ${ciWorldJoinAddress}")
                    }
                    def host = ciWorldJoinAddress.substring(0, separator)
                    def port = ciWorldJoinAddress.substring(separator + 1)
                    if (!(port ==~ /[0-9]{1,5}/) || port.toInteger() < 1 || port.toInteger() > 65535) {
                        throw new GradleException("Invalid IT16 server port: ${port}")
                    }
                    args '--server', host, '--port', port
                } else {
                    args '--quickPlayMultiplayer', ciWorldJoinAddress
                }
                if (ciWorldJoinUsername) args '--username', ciWorldJoinUsername
            }
        }

        server {
            args '--nogui'
            if (ciWorldJoin) {
                workingDirectory new File(ciWorldJoinRoot, 'server')
            }
        }

        gameTestServer {
            // GameTest sources are merged into main only for this run. Loading
            // sourceSets.gameTest as a second exploded mod breaks discovery on
            // the maintained legacy Forge targets.
        }

        data {
            workingDirectory dataRunDirectory
            args '--mod', requiredProperty('mod.id'), '--all',
                    '--output', generatedResources,
                    '--existing', effectiveSourceRoot.get().dir('src/main/resources').asFile
        }
    }
}

tasks.matching { it.name == 'runData' }.configureEach {
    dependsOn prepareEffectiveSource
    doFirst {
        // Datagen is an isolated, disposable workspace. Never let output from a
        // previous run leak into a later production build or the next runData.
        project.delete(generatedResources)
        generatedResources.mkdirs()
    }
}

repositories {
    // ForgeGradle supplies the Forge and Minecraft repositories.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        // fg.deobf stores remapped module variants in ForgeGradle's local repo.
        forRepositories(fg.repository)
        filter { includeGroup 'maven.modrinth' }
    }

    // Resolve Forge's own ModLauncher from the Forge Maven, not NeoForge Maven.
    // Keep the module exclusive so an unrelated Sponge outage cannot block these targets.
    exclusiveContent {
        forRepository {
            maven {
                name = 'MinecraftForgeModLauncher'
                url = 'https://maven.minecraftforge.net/'
            }
        }
        filter { includeModule 'cpw.mods', 'modlauncher' }
    }

    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }

    mavenCentral()
}

// Forge 43.x/47.x use ModLauncher 10.0.9. EventBus 6.0.3 requests
// 10.0.+ transitively; pin it to avoid a network metadata lookup for a
// dynamic version on every clean project configuration.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'cpw.mods'
                && details.requested.name == 'modlauncher'
                && details.requested.version == '10.0.+') {
            details.useVersion('10.0.9')
            details.because('Forge 43.x and 47.x ship ModLauncher 10.0.9')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraftVersion}-${forgeVersion}"

    def jeiDependency = optionalProperty('deps.jei')
    if (jeiCompatEnabled && jeiDependency) {
        compileOnly fg.deobf(jeiDependency)
        if (runtimeEnabled('jei', true)) {
            runtimeOnly fg.deobf(jeiDependency)
        }
    }

    def jadeDependency = optionalProperty('deps.jade')
    if (jadeCompatEnabled && jadeDependency) {
        compileOnly fg.deobf(jadeDependency)
        if (runtimeEnabled('jade', true)) {
            runtimeOnly fg.deobf(jadeDependency)
        }
    }

    def ic2Dependency = optionalProperty('deps.ic2')
    def carbonConfigDependency = optionalProperty('deps.carbon_config')
    if (ic2CompatEnabled && ic2Dependency) {
        compileOnly fg.deobf(ic2Dependency)
        if (runtimeEnabled('ic2', enableIc2Runtime)) {
            runtimeOnly fg.deobf(ic2Dependency)
            if (carbonConfigDependency) {
                runtimeOnly fg.deobf(carbonConfigDependency)
            }
        }
    }
    if (ic2CompatEnabled && carbonConfigDependency) {
        compileOnly fg.deobf(carbonConfigDependency)
    }

    def forestryDependency = optionalProperty('deps.forestry')
    if (forestryCompatEnabled && forestryDependency) {
        compileOnly fg.deobf(forestryDependency)
        if (runtimeEnabled('forestry', true)) {
            runtimeOnly fg.deobf(forestryDependency)
        }
    }

    def patchouliDependency = optionalProperty('deps.patchouli')
    if (forestryCompatEnabled && patchouliDependency) {
        compileOnly fg.deobf(patchouliDependency)
        if (runtimeEnabled('forestry', true)) {
            runtimeOnly fg.deobf(patchouliDependency)
        }
    }

    // CI real-world join: ForgeGradle userdev is Mojmap, not the obfuscated
    // production namespace. Do not put release AE2/ModernFix JARs into run/mods:
    // fg.deobf must remap their classes and Mixin reference maps first.
    if (ciWorldJoinExternalMods) {
        if (!ciWorldJoin || !ciRuntimeProfile.startsWith('modpack')) {
            throw new GradleException('ci_world_join_external_mods is restricted to IT16 modpack runs')
        }
        def modrinthProjects = [
            ae2: 'XxWD5pD3', modernfix: 'nmDcB62a', guideme: 'Ck4E7v7R',
            curios: 'vvuO3ImH', theoneprobe: 'Eyw0UxEx'
        ]
        def seen = [] as Set
        ciWorldJoinExternalMods.split(',').each { token ->
            if (!(token ==~ /[a-z0-9_]+:[A-Za-z0-9]{8}/)) {
                throw new GradleException("Invalid immutable CI mod pin: ${token}")
            }
            def parts = token.split(':')
            if (!modrinthProjects.containsKey(parts[0]) || !seen.add(parts[0])) {
                throw new GradleException("Unknown or repeated CI mod: ${parts[0]}")
            }
            runtimeOnly fg.deobf("maven.modrinth:${modrinthProjects[parts[0]]}:${parts[1]}")
        }
    }

    testImplementation "org.junit.jupiter:junit-jupiter-api:${requiredProperty('deps.junit')}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${requiredProperty('deps.junit')}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${requiredProperty('deps.junit')}"
}

// ForgeGradle 6 deobfuscates mod dependencies through fg.deobf.
// Some Forge targets expose reobfJar while newer toolchains may already produce a
// distributable Mojmap jar without that legacy task. Resolve the
// optional task only after this project has finished evaluating: configuring a
// TaskProvider from inside TaskCollection.configureEach is rejected by Gradle
// 8.8 as a nested task-container mutation.
afterEvaluate {
    def reobfTask = tasks.findByName('reobfJar')
    if (reobfTask != null) {
        tasks.getByName('jar').finalizedBy(reobfTask)
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    dependsOn prepareEffectiveSource
    // Keep legacy filesystem-based resource integrity tests working against a
    // conventional merged src/ view without reintroducing repository copies.
    workingDir effectiveSourceRoot.get().asFile
    systemProperty 'buildcraft.expectedPackFormat', requiredProperty('pack.format')
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

def resourceProperties = [
        mod_version: project.version.toString(),
        mod_authors: requiredProperty('mod.authors'),
        mod_license: requiredProperty('mod.license'),
        loader_version_range: requiredProperty('loader.version_range'),
        forge_version_range: requiredProperty('forge.version_range'),
        minecraft_version_range: requiredProperty('minecraft.version_range'),
        buildcraft_version_range: requiredProperty('buildcraft.version_range'),
        jei_version_range: requiredProperty('compat.jei.range'),
        jade_version_range: requiredProperty('compat.jade.range'),
        ic2_version_range: requiredProperty('compat.ic2.range'),
        forestry_version_range: requiredProperty('compat.forestry.range'),
        pack_format: requiredProperty('pack.format'),
        resource_pack_format: requiredProperty('pack.resource_format'),
        data_pack_format: requiredProperty('pack.data_format')
]

tasks.named('processResources', ProcessResources) {
    inputs.properties(resourceProperties)
    if (gameTestRunRequested) {
        // The GameTest resource tree intentionally overlays main. Keep the first copy
        // (GameTest resources are ordered first above) instead of failing on duplicates.
        duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
    }
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand(resourceProperties)
    }
}

tasks.named('jar', Jar) {
    archiveClassifier = ''
    manifest {
        attributes([
                'Specification-Title': requiredProperty('mod.name'),
                'Specification-Vendor': requiredProperty('mod.authors'),
                'Specification-Version': modVersion,
                'Implementation-Title': requiredProperty('mod.name'),
                'Implementation-Version': project.version,
                'Implementation-Vendor': requiredProperty('mod.authors')
        ])
    }
}

// JAR tasks already write directly to build/<minecraft-version> through common-target.gradle.
// Keep buildAndCollect as the stable CI/root-build entry point without a second copy step.
def cleanupStandaloneApiV2Artifacts = tasks.register('cleanupStandaloneApiV2Artifacts', Delete) {
    group = 'build'
    description = "Remove obsolete standalone API 2 jars for ${targetName}"
    delete fileTree(new File(project.buildDir, 'libs')) {
        include '*-api-v2.jar'
        include '*-api-v2-sources.jar'
    }
    delete fileTree(centralJarOutputDir) {
        include "${archiveName}-${project.version}-api-v2.jar"
        include "${archiveName}-${project.version}-api-v2-sources.jar"
    }
}

tasks.named('assemble') {
    dependsOn cleanupStandaloneApiV2Artifacts
}

tasks.register('buildAndCollect') {
    group = 'build'
    description = "Build ${targetName}; JAR artifacts are written to ${centralJarOutputDir}"
    dependsOn tasks.named('build')
}


// Compile independent addon fixtures a second time against the actual production JAR.
// The source-set probe alone would not detect packaging or ABI omissions.
def verifyApi2AddonBinary = tasks.register('verifyApi2AddonBinary', Exec) {
    group = 'verification'
    description = "Verify independent API v2 fixtures against the production ${targetName} JAR"
    dependsOn tasks.named('jar')
    dependsOn prepareEffectiveSource
    workingDir repositoryRoot
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    doFirst {
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def javac = tasks.named('compileJava', org.gradle.api.tasks.compile.JavaCompile)
            .get().javaCompiler.get().executablePath.asFile.absolutePath
        commandLine pythonExecutable,
            new File(repositoryRoot, 'scripts/verify-addon-binary.py').absolutePath,
            '--bcce-jar', jarFile.absolutePath,
            '--dependencies', sourceSets.main.compileClasspath.asPath,
            '--release', javaVersion.toString(),
            '--javac', javac,
            '--fixture-root', new File(effectiveSourceDir, 'addon-fixture/src/main/java/dev/bcce/apifixture').absolutePath,
            '--output', new File(project.buildDir, 'conformance/api2-fixtures.jar').absolutePath
    }
}

tasks.named('buildAndCollect') {
    dependsOn verifyApi2AddonBinary
}

// API 2 is bundled directly in the normal BuildCraft production jar.
// The isolated apiV2 source set and addonFixture remain verification-only: they
// prove that addons can compile against the public surface without implementation
// classes, but they intentionally do not create extra release artifacts.


publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url = new File(repositoryRoot, "mcmodsrepo/${buildGeneration}").toURI()
        }
    }
}





def validateApiV2Boundary = tasks.register('validateApiV2Boundary', Exec) {
    group = 'verification'
    description = 'Validate API v2 loader/implementation boundary and consumer fixture imports'
    workingDir repositoryRoot
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    commandLine pythonExecutable, new File(repositoryRoot, 'scripts/validate-api-v2.py').absolutePath
}

def validateApiV2Only = tasks.register('validateApiV2Only', Exec) {
    group = 'verification'
    description = 'Require buildcraft.api.v2 to be the only public BuildCraft Java API surface'
    workingDir repositoryRoot
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    commandLine pythonExecutable, new File(repositoryRoot, 'scripts/validate-api-v2-only.py').absolutePath
}

tasks.named('compileApiV2Java') { dependsOn prepareEffectiveSource }
tasks.named('compileAddonFixtureJava') { dependsOn tasks.named('compileApiV2Java') }
tasks.named('check') {
    dependsOn validateApiV2Boundary
    dependsOn validateApiV2Only
    dependsOn tasks.named('compileApiV2Java')
    dependsOn tasks.named('compileAddonFixtureJava')
}

tasks.withType(ProcessResources).configureEach {
    dependsOn prepareEffectiveSource
}
tasks.withType(JavaCompile).configureEach {
    dependsOn prepareEffectiveSource
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:none')
}

idea.module {
    downloadJavadoc = true
    downloadSources = true
}

eclipse.classpath {
    downloadJavadoc = true
    downloadSources = true
}
