/* Fabric-specific target adapter. Stage 4 server foundation. */
apply from: new File(rootProject.file('../..').canonicalFile, 'build-logic/common-target.gradle')

def bc = project.ext.bcTarget
def targetName = bc.targetName
def buildGeneration = bc.buildGeneration
def repositoryRoot = bc.repositoryRoot
def requiredProperty = bc.requiredProperty
def minecraftVersion = bc.minecraftVersion
def modVersion = bc.modVersion
def archiveName = bc.archiveName
def resolveSourceFile = bc.resolveSourceFile
def effectiveSourceRoot = bc.effectiveSourceRoot
def prepareEffectiveSource = bc.prepareEffectiveSource
def effectiveSourceDir = bc.effectiveSourceDir
def effectiveDirs = bc.effectiveDirs
def centralJarOutputDir = bc.centralJarOutputDir

def fabricLoaderVersion = requiredProperty('deps.fabric_loader')
def fabricApiVersion = requiredProperty('deps.fabric_api')
def energyApiVersion = requiredProperty('deps.energy_api')
def targetAccessWidener = resolveSourceFile('src/main/resources/buildcraft.accesswidener')
if (targetAccessWidener == null) {
    throw new GradleException("Fabric target '${targetName}' is missing buildcraft.accesswidener")
}

def fabricProfile = requiredProperty('build.profile')
if (fabricProfile != 'server_foundation') {
    throw new GradleException("Fabric adapter expects the stage-4 server_foundation profile; got '${fabricProfile}'")
}

// Stage 4 compiles loader-neutral API/runtime infrastructure plus Fabric platform adapters.
// Gameplay modules remain outside this source set until the parity stage.
sourceSets {
    main {
        java.setSrcDirs(effectiveDirs('src/main/java'))
        java.include 'buildcraft/api/v2/**'
        java.include 'buildcraft/fabric/**'
        java.include 'buildcraft/lib/net/BC*.java'
        java.include 'buildcraft/lib/net/Fabric*.java'
        java.include 'buildcraft/lib/net/BuildCraftTarget.java'
        java.include 'buildcraft/lib/internal/module/IBuildCraftMod.java'
        java.include 'buildcraft/lib/internal/module/BCModules.java'
        java.include 'buildcraft/lib/internal/transfer/**'
        java.include 'buildcraft/lib/internal/api/v2/**'
        java.include 'buildcraft/lib/internal/mj/MjApi2PlatformBridge.java'
        java.include 'buildcraft/lib/platform/**'
        resources.setSrcDirs(effectiveDirs('src/main/resources'))
        resources.include 'fabric.mod.json'
        resources.include 'buildcraft.accesswidener'
        resources.include 'buildcraft.fabric.mixins.json'
        resources.include 'pack.mcmeta'
    }
    apiV2 {
        java.setSrcDirs(effectiveDirs('src/main/java'))
        java.include 'buildcraft/api/v2/**'
        resources.setSrcDirs([])
        compileClasspath = sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
    addonFixture {
        java.setSrcDirs([new File(effectiveSourceDir, 'addon-fixture/src/main/java')])
        resources.setSrcDirs([])
        compileClasspath = sourceSets.apiV2.output + sourceSets.apiV2.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
}

// Keep generated target metadata available to the bootstrap while the rest of gameplay is excluded.
def generatedTargetSources = layout.buildDirectory.dir('generated/sources/buildcraftTarget/java')
def javaLiteral = { String value ->
    value.replace('\\', '\\\\')
            .replace('"', '\\"')
            .replace('\r', '\\r')
            .replace('\n', '\\n')
}
def targetValues = [
        minecraft: minecraftVersion,
        loader: 'fabric',
        protocol: requiredProperty('network.protocol'),
        modVersion: project.version.toString(),
]
def generateBuildCraftTarget = tasks.register('generateBuildCraftTarget') {
    inputs.properties(targetValues)
    outputs.dir(generatedTargetSources)
    doLast {
        def outputFile = generatedTargetSources.get().file('buildcraft/lib/net/BuildCraftTarget.java').asFile
        outputFile.parentFile.mkdirs()
        outputFile.setText("""package buildcraft.lib.net;

/** Generated by Gradle for the ${targetName} Fabric server-foundation target. */
public final class BuildCraftTarget {
    public static final String MINECRAFT_VERSION = \"${javaLiteral(targetValues.minecraft)}\";
    public static final String LOADER = \"${javaLiteral(targetValues.loader)}\";
    public static final String NETWORK_PROTOCOL = \"${javaLiteral(targetValues.protocol)}\";
    public static final String MOD_VERSION = \"${javaLiteral(targetValues.modVersion)}\";
    public static final String GIT_BRANCH = \"unknown\";
    public static final String GIT_COMMIT_HASH = \"unknown\";
    public static final String GIT_COMMIT_MESSAGE = \"unknown\";
    public static final String GIT_COMMIT_AUTHOR = \"unknown\";

    private BuildCraftTarget() {}
}
""", 'UTF-8')
    }
}
sourceSets.main.java.srcDir(generatedTargetSources)

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    modImplementation "teamreborn:energy:${energyApiVersion}"
    include "teamreborn:energy:${energyApiVersion}"

    testImplementation "org.junit.jupiter:junit-jupiter-api:${requiredProperty('deps.junit')}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${requiredProperty('deps.junit')}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${requiredProperty('deps.junit')}"
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

loom {
    accessWidenerPath = targetAccessWidener
    runs {
        client {
            client()
            configName = "BuildCraft ${targetName} client"
            runDir = new File(repositoryRoot, "run/${buildGeneration}/${targetName}").absolutePath
        }
        server {
            server()
            configName = "BuildCraft ${targetName} server"
            runDir = new File(repositoryRoot, "run/${buildGeneration}/${targetName}").absolutePath
        }
    }
}

def resourceProperties = [
        mod_version: project.version.toString(),
        mod_authors: requiredProperty('mod.authors'),
        mod_license: requiredProperty('mod.license'),
        loader_version_range: requiredProperty('loader.version_range'),
        fabric_api_version_range: requiredProperty('fabric_api.version_range'),
        minecraft_version_range: requiredProperty('minecraft.version_range'),
        pack_format: requiredProperty('pack.format'),
        resource_pack_format: requiredProperty('pack.resource_format'),
        data_pack_format: requiredProperty('pack.data_format')
]

tasks.named('processResources', ProcessResources) {
    dependsOn prepareEffectiveSource
    inputs.properties(resourceProperties)
    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand(resourceProperties)
    }
}

tasks.named('compileJava') {
    dependsOn prepareEffectiveSource
    dependsOn generateBuildCraftTarget
}
tasks.named('compileApiV2Java') { dependsOn prepareEffectiveSource }
tasks.named('compileAddonFixtureJava') { dependsOn tasks.named('compileApiV2Java') }

tasks.named('jar', Jar) {
    archiveClassifier = 'dev'
    manifest {
        attributes([
                'Specification-Title': requiredProperty('mod.name'),
                'Specification-Vendor': requiredProperty('mod.authors'),
                'Specification-Version': modVersion,
                'Implementation-Title': requiredProperty('mod.name'),
                'Implementation-Version': project.version,
                'Implementation-Vendor': requiredProperty('mod.authors'),
                'BuildCraft-Fabric-Stage': 'server-foundation'
        ])
    }
}

tasks.named('remapJar') {
    dependsOn prepareEffectiveSource
    archiveClassifier = ''
    destinationDirectory.set(centralJarOutputDir)
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

def validateApiV2Boundary = tasks.register('validateApiV2Boundary', Exec) {
    group = 'verification'
    description = 'Validate API v2 loader/implementation boundary'
    workingDir repositoryRoot
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    commandLine bc.pythonExecutable, new File(repositoryRoot, 'scripts/validate-api-v2.py').absolutePath
}

def validateApiV2Only = tasks.register('validateApiV2Only', Exec) {
    group = 'verification'
    description = 'Require buildcraft.api.v2 to remain the only public BuildCraft Java API surface'
    workingDir repositoryRoot
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    commandLine bc.pythonExecutable, new File(repositoryRoot, 'scripts/validate-api-v2-only.py').absolutePath
}

tasks.named('check') {
    dependsOn validateApiV2Boundary
    dependsOn validateApiV2Only
    dependsOn tasks.named('compileApiV2Java')
    dependsOn tasks.named('compileAddonFixtureJava')
}

tasks.register('buildAndCollect') {
    group = 'build'
    description = "Build the ${targetName} Fabric server foundation and write its remapped JAR to ${centralJarOutputDir}"
    dependsOn tasks.named('build')
    dependsOn tasks.named('remapJar')
}

tasks.withType(JavaCompile).configureEach {
    dependsOn prepareEffectiveSource
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:none')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact tasks.named('remapJar')
        }
    }
}

idea.module {
    downloadJavadoc = true
    downloadSources = true
}
eclipse.classpath {
    downloadJavadoc = true
    downloadSources = true
}
