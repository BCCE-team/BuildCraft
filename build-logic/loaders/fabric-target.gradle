/* Production Fabric 26.3 adapter. Source and metadata are materialized by common-target.gradle. */
apply from: new File(rootProject.file('../..').canonicalFile, 'build-logic/common-target.gradle')

def bc = project.ext.bcTarget
def repositoryRoot = bc.repositoryRoot
def targetName = bc.targetName
def minecraftVersion = bc.minecraftVersion
def requiredProperty = bc.requiredProperty
def optionalProperty = bc.optionalProperty
def modVersion = bc.modVersion
def sourceDirs = bc.effectiveDirs
def prepareEffectiveSource = bc.prepareEffectiveSource
def effectiveSourceDir = bc.effectiveSourceDir
def pythonExecutable = bc.pythonExecutable
def centralJarOutputDir = bc.centralJarOutputDir

def ciWorldJoin = providers.gradleProperty('ci_world_join').map { it.toBoolean() }.getOrElse(false)
def ciWorldJoinAddress = providers.gradleProperty('ci_world_join_address').getOrElse('127.0.0.1:25588')
def ciWorldJoinClientSlot = providers.gradleProperty('ci_world_join_client_slot').getOrElse('1')
def ciWorldJoinUsername = providers.gradleProperty('ci_world_join_username').getOrElse('')
if (ciWorldJoin && !(ciWorldJoinClientSlot in ['1', '2'])) {
    throw new GradleException('Invalid Fabric IT16 client slot: ' + ciWorldJoinClientSlot)
}
if (ciWorldJoinUsername && !(ciWorldJoinUsername ==~ /[A-Za-z0-9_]{1,16}/)) {
    throw new GradleException('Invalid Fabric IT16 username')
}
def ciWorldJoinRoot = new File(repositoryRoot, "run-modpack-join/26.X/${targetName}")

if (bc.loaderName != 'fabric' || minecraftVersion != '26.3') {
    throw new GradleException("Fabric adapter supports 26.3-fabric, received ${targetName}")
}

repositories {
    maven { name = 'FabricMC'; url = 'https://maven.fabricmc.net/' }
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

sourceSets {
    main {
        java.setSrcDirs(sourceDirs('src/main/java'))
        resources.setSrcDirs(sourceDirs('src/main/resources'))
    }
    test {
        java.setSrcDirs(sourceDirs('src/test/java'))
        resources.setSrcDirs(sourceDirs('src/test/resources'))
    }
    apiV2 {
        java.setSrcDirs(sourceDirs('src/main/java'))
        java.include 'buildcraft/api/v2/**'
        resources.setSrcDirs([])
        compileClasspath = sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
    addonFixture {
        java.setSrcDirs([new File(effectiveSourceDir, 'addon-fixture/src/main/java')])
        resources.setSrcDirs([])
        compileClasspath = sourceSets.apiV2.output + sourceSets.apiV2.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
}
// A generated target class replaces the hard-coded metadata from the standalone Fabric branch.
def generatedTargetSources = layout.buildDirectory.dir('generated/sources/buildcraftTarget/java')
def gitMetadata = { List<String> args ->
    try {
        def process = new ProcessBuilder(['git'] + args).directory(repositoryRoot).redirectErrorStream(true).start()
        def result = process.inputStream.getText('UTF-8').trim()
        process.waitFor() == 0 && !result.isBlank() ? result : 'unknown'
    } catch (Exception ignored) { 'unknown' }
}
def javaLiteral = { String value ->
    value.replace('\\', '\\\\').replace('"', '\\"').replace('\r', '\\r').replace('\n', '\\n')
}
def values = [
        MINECRAFT_VERSION: minecraftVersion,
        LOADER: 'fabric',
        NETWORK_PROTOCOL: requiredProperty('network.protocol'),
        MOD_VERSION: project.version.toString(),
        TARGET_ID: targetName,
        GIT_BRANCH: providers.environmentVariable('GITHUB_REF_NAME').getOrElse(gitMetadata(['rev-parse', '--abbrev-ref', 'HEAD'])),
        GIT_COMMIT_HASH: providers.environmentVariable('GITHUB_SHA').getOrElse(gitMetadata(['rev-parse', 'HEAD'])),
        GIT_COMMIT_MESSAGE: gitMetadata(['log', '-1', '--pretty=%s']),
        GIT_COMMIT_AUTHOR: gitMetadata(['log', '-1', '--pretty=%an <%ae>'])
]
def generateBuildCraftTarget = tasks.register('generateBuildCraftTarget') {
    inputs.properties(values)
    outputs.dir(generatedTargetSources)
    doLast {
        def output = generatedTargetSources.get().file('buildcraft/lib/net/BuildCraftTarget.java').asFile
        output.parentFile.mkdirs()
        output.setText('package buildcraft.lib.net;\n' +
                '/** Metadata generated by the canonical Fabric target. */\n' +
                'public final class BuildCraftTarget {\n' +
                values.collect { key, value ->
                    "    public static final String ${key} = \"${javaLiteral(value)}\";\n"
                }.join('') +
                '    private BuildCraftTarget() {}\n}\n', 'UTF-8')
    }
}
sourceSets.main.java.srcDir(generatedTargetSources)
tasks.named('compileJava') { dependsOn generateBuildCraftTarget }

// Fabric 26.3 uses named, non-obfuscated Minecraft: no Yarn, intermediary or remapJar.
loom {
    accessWidenerPath = bc.targetAccessWidener
    runs {
        client {
            client()
            runDir = ciWorldJoin
                    ? new File(ciWorldJoinRoot, ciWorldJoinClientSlot == '2' ? 'client-2' : 'client').absolutePath
                    : new File(repositoryRoot, "run/26.X/${targetName}").absolutePath
            jvmArguments.add('--sun-misc-unsafe-memory-access=allow')
            if (ciWorldJoin) {
                programArguments.addAll('--quickPlayMultiplayer', ciWorldJoinAddress)
                if (ciWorldJoinUsername) programArguments.addAll('--username', ciWorldJoinUsername)
            }
        }
        server {
            server()
            runDir = ciWorldJoin ? new File(ciWorldJoinRoot, 'server').absolutePath
                    : new File(repositoryRoot, "run/26.X/${targetName}").absolutePath
            jvmArguments.add('--sun-misc-unsafe-memory-access=allow')
        }
    }
}

// Loom creates the server GameTest task and a dedicated test source set.
// If the server GameTest API changes, CI must fail rather than silently skip it.
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'buildcraft-fabric-gametest'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
    }
}
sourceSets.gametest.java.setSrcDirs(sourceDirs('src/gametest/java'))
sourceSets.gametest.resources.setSrcDirs(sourceDirs('src/gametest/resources'))

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${requiredProperty('deps.fabric_loader')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${requiredProperty('deps.fabric_api')}"
    implementation "teamreborn:energy:${requiredProperty('deps.energy')}"
    compileOnly requiredProperty('deps.jei')
    compileOnly requiredProperty('deps.jade')
    // JEI/Jade are dev-runtime only, never bundled inside BCCE.
    runtimeOnly requiredProperty('deps.jei')
    runtimeOnly requiredProperty('deps.jade')
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    testImplementation "org.junit.jupiter:junit-jupiter-api:${requiredProperty('deps.junit')}"
    // The shared tests use @ParameterizedTest, @MethodSource and Arguments.
    testImplementation "org.junit.jupiter:junit-jupiter-params:${requiredProperty('deps.junit')}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${requiredProperty('deps.junit')}"
    // Align the unversioned launcher with the pinned Jupiter modules on Gradle 9.
    testRuntimeOnly platform("org.junit:junit-bom:${requiredProperty('deps.junit')}")
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    include "teamreborn:energy:5.0.0"

}

// The installed production server needs these external mods in mods/, not in the BCCE jar.
configurations {
    fabricDistributionMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}
dependencies {
    fabricDistributionMods "net.fabricmc.fabric-api:fabric-api:${requiredProperty('deps.fabric_api')}"
    fabricDistributionMods "teamreborn:energy:${requiredProperty('deps.energy')}"
}
tasks.register('collectFabricServerMods', Copy) {
    group = 'distribution'
    description = 'Collect Fabric API and Energy for the installed production-server smoke test'
    from configurations.fabricDistributionMods
    into new File(repositoryRoot, "build/server-deps/${targetName}")
}

// Isolate the native Fabric source: reject a NeoForge dependency at compile time.
def verifyFabricIsolation = tasks.register('verifyFabric263Isolation') {
    group = 'verification'
    description = 'Ensure no NeoForge-owned API enters Fabric runtime or public API'
    dependsOn prepareEffectiveSource
    doLast {
        def javaRoot = new File(effectiveSourceDir, 'src/main/java')
        def offenders = fileTree(javaRoot).matching { include '**/*.java' }.files
                .findAll { it.getText('UTF-8').contains('net.neoforged.') }
                .collect { javaRoot.toPath().relativize(it.toPath()).toString() }.sort()
        if (!offenders.isEmpty()) {
            throw new GradleException("${targetName} still contains NeoForge references:\n" + offenders.take(80).join('\n'))
        }
    }
}
tasks.named('jar') { dependsOn verifyFabricIsolation }
tasks.named('check') { dependsOn verifyFabricIsolation }
// Fabric's unit tests read source-relative recipes, guide JSON and Java source
// from the materialized target, exactly as the NeoForge/Forge adapters do.
// Do not run these tests from builds/26.X/versions/26.3-fabric, where the
// checked-in resources and source files do not exist.
def packagedModJar = tasks.named('jar', Jar)
tasks.named('test', Test) {
    useJUnitPlatform()
    dependsOn prepareEffectiveSource, packagedModJar
    workingDir effectiveSourceDir
    systemProperty 'buildcraft.expectedPackFormat', requiredProperty('pack.format')

    // Classpath dependencies (including Minecraft) may also contain pack.mcmeta.
    // Verify the packaged resources and put BCCE's own JAR first so the metadata
    // assertion tests the released artifact, not an unrelated dependency.
    classpath = files(packagedModJar.flatMap { it.archiveFile }) + classpath
    doFirst {
        def archive = packagedModJar.get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(archive)
        try {
            for (String relative : ['pack.mcmeta',
                                    'assets/buildcraft/guide/original_manifest.json',
                                    'assets/buildcraft/guide/text/en_us.json',
                                    'assets/buildcraft/lang/en_us.json']) {
                if (zip.getEntry(relative) == null) {
                    throw new GradleException("Missing packaged BCCE resource: ${relative} in ${archive}")
                }
            }
            def metadata = zip.getInputStream(zip.getEntry('pack.mcmeta')).getText('UTF-8')
            def actualFormat = new groovy.json.JsonSlurper().parseText(metadata).pack.pack_format
            def expectedFormat = requiredProperty('pack.format').toBigDecimal()
            if (new BigDecimal(actualFormat.toString()).compareTo(expectedFormat) != 0) {
                throw new GradleException("Incorrect BCCE pack_format in ${archive}: ${actualFormat} != ${expectedFormat}")
            }
        } finally {
            zip.close()
        }
    }
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

def resourceProperties = [
        version: project.version.toString()
]
tasks.named('processResources', ProcessResources) {
    dependsOn prepareEffectiveSource
    inputs.properties(resourceProperties)
    filesMatching('fabric.mod.json') { expand(resourceProperties) }
}
tasks.withType(ProcessResources).configureEach { dependsOn prepareEffectiveSource }
tasks.withType(JavaCompile).configureEach {
    dependsOn prepareEffectiveSource
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs.addAll(['-Xmaxerrs', '800'])
}
// The canonical source materializer must also run before GameTest compilation.
tasks.named('compileApiV2Java') { dependsOn prepareEffectiveSource }
tasks.named('compileAddonFixtureJava') { dependsOn tasks.named('compileApiV2Java') }

// CI and local runners share the exact same task names across all loaders.
tasks.register('runGameTestServer') {
    group = 'verification'
    description = 'Run real Fabric API server GameTests (alias of Loom runGameTest)'
    dependsOn tasks.named('runGameTest')
}
tasks.named('check') {
    dependsOn tasks.named('compileApiV2Java')
    dependsOn tasks.named('compileAddonFixtureJava')
}
// The main Fabric JAR includes public API v2, and the addon fixture remains a verification-only compile.
tasks.named('jar', Jar) {
    from(new File(repositoryRoot, 'LICENSE.txt')) {
        rename { name -> "${name}_${bc.archiveName}" }
    }
}

publishing {
    publications { register('mavenJava', MavenPublication) { artifact jar } }
    repositories { maven { url = new File(repositoryRoot, 'mcmodsrepo/26.X').toURI() } }
}
tasks.register('buildAndCollect') {
    group = 'build'
    description = "Build and collect ${targetName} in ${centralJarOutputDir}"
    dependsOn tasks.named('build')
}
