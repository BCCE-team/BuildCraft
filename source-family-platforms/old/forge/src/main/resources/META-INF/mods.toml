modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
showAsResourcePack=false

[[mods]]
    modId="buildcraftlib"
    version="${mod_version}"
    displayName="BuildCraft Community Edition - Library"
    credits="Special thanks to the original BuildCraft team and all contributors."
    authors="${mod_authors}"
    description='''
Shared library code and runtime helpers used by the BuildCraft Community Edition modules.
    '''
    displayTest="MATCH_VERSION"

[[dependencies.buildcraftlib]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.buildcraftlib]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.buildcraftlib]]
    modId="jei"
    mandatory=false
    versionRange="${jei_version_range}"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.buildcraftlib]]
    modId="jade"
    mandatory=false
    versionRange="${jade_version_range}"
    ordering="AFTER"
    side="BOTH"

//? if <1.20 {
[[dependencies.buildcraftlib]]
    modId="ic2"
    mandatory=false
    versionRange="${ic2_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.buildcraftlib]]
    modId="forestry"
    mandatory=false
    versionRange="${forestry_version_range}"
    ordering="AFTER"
    side="BOTH"

//?}
